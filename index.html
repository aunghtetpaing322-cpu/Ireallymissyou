<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes or no 💗</title>
<style>
  :root { --pink:#ff4f87; --deep:#e92e70; --soft:#fff0f5; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(circle at top, #fff 0, #ffe4ee 48%, #ffc6dc 100%);
    color:#5a2440;
  }
  .card {
    width:min(92vw, 520px); min-height:390px; padding:36px 22px 28px;
    text-align:center; background:rgba(255,255,255,.88); border:2px solid white;
    border-radius:28px; box-shadow:0 18px 55px #d9437a28; position:relative; z-index:1;
  }
  .heart { font-size:54px; animation: beat 1s infinite; display:inline-block; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
  h1 { font-size:clamp(27px,6vw,40px); margin:12px 0 8px; }
  p { font-size:17px; margin:0 0 28px; color:#92516d; }
  .arena { height:180px; position:relative; margin:0 auto; max-width:430px; }
  button {
    border:0; border-radius:999px; padding:14px 28px; font-size:17px; font-weight:750;
    cursor:pointer; box-shadow:0 7px 15px #8c365020; touch-action:manipulation;
    -webkit-tap-highlight-color: transparent; -webkit-appearance:none; appearance:none;
    outline:none; user-select:none; -webkit-user-select:none;
  }
  button:focus, button:focus-visible, button:active {
    outline:none;
  }
  button:focus-visible {
    box-shadow:0 0 0 3px rgba(233,46,112,.22), 0 7px 15px #8c365020;
  }
  #yes { background:linear-gradient(135deg,#ff6395,#ed3477); color:white; position:absolute; left:15%; top:15px; }
  #no { background:#f0edf0; color:#6c5963; position:absolute; left:57%; top:15px; transition:left .13s ease,top .13s ease; }
  #result { display:none; margin-top:12px; animation: pop .45s ease both; }
  #result .big { font-size:30px; font-weight:800; color:#e92e70; }
  #result .small { margin-top:8px; }
  @keyframes pop { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
  .floating { position:fixed; bottom:-40px; pointer-events:none; animation:floatUp linear forwards; opacity:.7; z-index:0; }
  @keyframes floatUp { to { transform:translateY(-115vh) rotate(25deg); opacity:0; } }
  .hint { font-size:12px; color:#b17a91; margin-top:8px; }
  @media(max-width:400px) { .card{padding:30px 12px 22px;min-height:430px} .arena{height:220px} #yes{left:5%} #no{left:56%} }
</style>
</head>
<body>
<main class="card">
  <div class="heart">💗</div>
  <h1>Can we talk like what we used to?</h1>
  <p>Pleaseeeee....... 😥</p>
  <div class="arena" id="arena">
    <button id="yes">YES 💖</button>
    <button id="no" aria-label="No">NO 😏</button>
  </div>
  <div class="hint" id="hint">Psst… try clicking NO 😏</div>
  <div id="result">
    <div class="big">YAY!!! 🥹💞</div>
    <div class="small">I miss you so much. Can i come to your viber now? 💐</div>
    <div style="font-size:38px;margin-top:12px">💘 🧸 💘</div>
  </div>
</main>
<script>
const arena = document.getElementById('arena');
const no = document.getElementById('no');
const yes = document.getElementById('yes');
const hint = document.getElementById('hint');
const result = document.getElementById('result');

// Paste your deployed Google Apps Script Web app URL (ending in /exec) here.
const GOOGLE_SCRIPT_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';

function dodge() {
  const area = arena.getBoundingClientRect();
  const yesRect = yes.getBoundingClientRect();
  const noRect = no.getBoundingClientRect();
  const maxX = Math.max(0, area.width - noRect.width);
  const maxY = Math.max(0, area.height - noRect.height);
  const gap = 14;

  const yesX = yesRect.left - area.left;
  const yesY = yesRect.top - area.top;
  const yesW = yesRect.width;
  const yesH = yesRect.height;
  const currentX = noRect.left - area.left;
  const currentY = noRect.top - area.top;

  // Sample many positions, reject anything that touches YES, then choose
  // a far-away destination so the NO button makes a dramatic escape.
  let best = null;
  let bestScore = -1;
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    const overlapsYes =
      x < yesX + yesW + gap &&
      x + noRect.width + gap > yesX &&
      y < yesY + yesH + gap &&
      y + noRect.height + gap > yesY;
    if (overlapsYes) continue;

    const distance = Math.hypot(x - currentX, y - currentY);
    const edgeBonus = (x < 18 || x > maxX - 18 || y < 18 || y > maxY - 18) ? 45 : 0;
    const score = distance + edgeBonus;
    if (score > bestScore) {
      bestScore = score;
      best = {x, y};
    }
  }

  if (best) {
    no.style.left = best.x + 'px';
    no.style.top = best.y + 'px';
  }

  hint.textContent = ['Too slow 😂','Nope, not today 😜','Catch me if you can! 🏃‍♀️','You almost got me! 😳','Not a chance! 🤭'][Math.floor(Math.random()*5)];
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('pointerdown', e => { e.preventDefault(); dodge(); });
no.addEventListener('click', e => { e.preventDefault(); dodge(); });
arena.addEventListener('pointermove', e => {
  const r = no.getBoundingClientRect();
  const dx = (r.left + r.width/2) - e.clientX;
  const dy = (r.top + r.height/2) - e.clientY;
  if (Math.hypot(dx,dy) < 75) dodge();
});
yes.addEventListener('click', () => {
  arena.style.display = 'none';
  hint.style.display = 'none';
  result.style.display = 'block';

  // Send the YES response in the background. The page still works if tracking fails.
  if (GOOGLE_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbxKbaNp04qEDn0wpf9gLTUwjqu7bPocREuZT-Jze1XLZgBjyeK-ngQwZut8_oRKNE57/exec') {
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ response: 'YES' })
    }).catch(error => console.error('Could not submit response:', error));
  }

  for (let i=0;i<34;i++) {
    const h = document.createElement('div');
    h.className='floating';
    h.textContent=['💗','💖','💕','✨','🌸'][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(18+Math.random()*22)+'px';
    h.style.animationDuration=(3+Math.random()*4)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7500);
  }
});
</script>
</body>
</html>
